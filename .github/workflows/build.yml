
name: Build Aloo Sensi Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "AlooSensiPro/settings.gradle" ]; then
            PROJECT_DIR="AlooSensiPro"
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "Android project ZIP not found!"
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/aloo-project"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/aloo-project"

            PROJECT_DIR="$(find "$RUNNER_TEMP/aloo-project" -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Valid Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALOO-SENSI-PRO-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
